<!DOCTYPE html>
<html>
<head>
    <title>Product Listing</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background-color: aquamarine;
        }
    </style>
</head>
<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">E-Commerce Products</h2>

    <!-- FILTER -->
    <div class="dropdown text-center mb-4">
        <button class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">
            Category
        </button>

        <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" onclick="show('all')">All</a></li>
            <li><a class="dropdown-item" href="#" onclick="show('elec')">Electronics</a></li>
            <li><a class="dropdown-item" href="#" onclick="show('cloth')">Clothing</a></li>
        </ul>
    </div>

    <!-- GRID -->
    <div class="row">

        <!-- ITEM 1 -->
        <div class="col-md-4 mb-4 item elec">
            <div class="card">
                <img src="images/p1.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Headphones</h5>
                    <p>₹7999</p>
                </div>
            </div>
        </div>

        <!-- ITEM 2 -->
        <div class="col-md-4 mb-4 item cloth">
            <div class="card">
                <img src="images/p2.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>T-Shirt</h5>
                    <p>₹999</p>
                </div>
            </div>
        </div>

        <!-- ITEM 3 -->
        <div class="col-md-4 mb-4 item elec">
            <div class="card">
                <img src="images/p3.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Smartwatch</h5>
                    <p>₹12999</p>
                </div>
            </div>
        </div>

        <!-- ITEM 4 -->
        <div class="col-md-4 mb-4 item cloth">
            <div class="card">
                <img src="images/p4.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Shoes</h5>
                    <p>₹2999</p>
                </div>
            </div>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- SIMPLE JS -->
<script>
function show(type){

    let items = document.querySelectorAll(".item");

    items.forEach(i => {
        if(type === "all" || i.classList.contains(type)){
            i.style.display = "block";
        } else {
            i.style.display = "none";
        }
    });

}
</script>

</body>
</html>
