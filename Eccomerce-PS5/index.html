<!doctype html>
<html>
  <head>
    <title>Product Listing</title>

    <!-- Bootstrap -->
    <link href="bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background-color: aquamarine;
      }
    </style>
  </head>
  <body>
    <div class="container mt-4">
      <h2 class="text-center mb-4">E-Commerce Products</h2>

      <!-- FILTER -->
      <div class="dropdown text-center mb-4">
        <button
          class="btn btn-primary dropdown-toggle"
          data-bs-toggle="dropdown"
        >
          Category
        </button>

        <ul class="dropdown-menu">
          <li>
            <a class="dropdown-item" href="#" onclick="show('all')">All</a>
          </li>
          <li>
            <a class="dropdown-item" href="#" onclick="show('elec')"
              >Electronics</a
            >
          </li>
          <li>
            <a class="dropdown-item" href="#" onclick="show('cloth')"
              >Clothing</a
            >
          </li>
        </ul>
      </div>

      <!-- GRID -->
      <div class="row">
        <!-- ITEM 1 -->
        <div class="col-md-4 mb-4 item elec">
          <div class="card">
            <img src="images/p1.png" class="card-img-top" />
            <div class="card-body text-center">
              <h5>Headphones</h5>
              <p>₹7999</p>
            </div>
          </div>
        </div>

        <!-- ITEM 2 -->
        <div class="col-md-4 mb-4 item cloth">
          <div class="card">
            <img src="images/p2.png" class="card-img-top" />
            <div class="card-body text-center">
              <h5>T-Shirt</h5>
              <p>₹999</p>
            </div>
          </div>
        </div>

        <!-- ITEM 3 -->
        <div class="col-md-4 mb-4 item elec">
          <div class="card">
            <img src="images/p3.png" class="card-img-top" />
            <div class="card-body text-center">
              <h5>Smartwatch</h5>
              <p>₹12999</p>
            </div>
          </div>
        </div>

        <!-- ITEM 4 -->
        <div class="col-md-4 mb-4 item cloth">
          <div class="card">
            <img src="images/p4.png" class="card-img-top" />
            <div class="card-body text-center">
              <h5>Shoes</h5>
              <p>₹2999</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="bootstrap.bundle.min.js"></script>

    <!-- SIMPLE JS -->
    <script>
      function show(type) {
        var items = document.getElementsByClassName("item");

        for (var i = 0; i < items.length; i++) {
          if (type == "all") {
            items[i].style.display = "block";
          } else if (items[i].className.includes(type)) {
            items[i].style.display = "block";
          }
          else {
            items[i].style.display = "none";
          }
        }
      }
    </script>
  </body>
</html>
