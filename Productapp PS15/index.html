<!doctype html>
<html>
  <head>
    <title>Product Catalog</title>

    <style>
      body {
        font-family: Arial;
        background: #f4f6f9;
        margin: 0;
        text-align: center;
      }

      h2 {
        margin-top: 20px;
      }

      .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
      }

      .card {
        background: white;
        width: 200px;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      .card img {
        width: 100%;
        border-radius: 5px;
      }

      .name {
        font-weight: bold;
        margin-top: 10px;
      }

      .price {
        color: green;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <h2>Product Catalog</h2>

    <div class="container" id="products"></div>

    <script>
      fetch("/api/products")
        .then((res) => res.json())
        .then((data) => {
          let container = document.getElementById("products");

          data.forEach((p) => {
            container.innerHTML += `
            <div class="card">
                <img src="${p.image}">
                <div>${p.name}</div>
                <div>${p.price}</div>
            </div>
        `;
          });
        });
    </script>
  </body>
</html>
