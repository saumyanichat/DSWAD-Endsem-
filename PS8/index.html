<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }
        .box{
            max-width:450px;
            margin:50px auto;
            padding:20px;
            background:white;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="box">

    <h3 class="text-center mb-4">Event Registration</h3>

    <form class="needs-validation" novalidate>

        <!-- NAME -->
        <div class="form-floating mb-3">
            <input type="text" class="form-control" placeholder="Name" required
                   pattern="[A-Za-z ]+"
                   data-bs-toggle="tooltip" title="Only letters allowed">
            <label>Name</label>
            <div class="invalid-feedback">
                Enter valid name (letters only)
            </div>
        </div>

        <!-- EMAIL -->
        <div class="form-floating mb-3">
            <input type="email" class="form-control" placeholder="Email" required
                   data-bs-toggle="tooltip" title="Enter valid email">
            <label>Email</label>
            <div class="invalid-feedback">
                Enter valid email
            </div>
        </div>

        <!-- PHONE -->
        <div class="form-floating mb-3">
            <input type="tel" class="form-control" placeholder="Phone" required
                   pattern="[0-9]{10}" maxlength="10"
                   data-bs-toggle="tooltip" title="Enter 10 digit number">
            <label>Phone</label>
            <div class="invalid-feedback">
                Enter 10 digit phone number
            </div>
        </div>

        <!-- EVENT -->
        <div class="form-floating mb-3">
            <select class="form-select" required>
                <option value="">Select</option>
                <option>Workshop</option>
                <option>Seminar</option>
                <option>Hackathon</option>
            </select>
            <label>Event Type</label>
            <div class="invalid-feedback">
                Please select event type
            </div>
        </div>

        <!-- GENDER -->
        <div class="mb-3">
            <label class="form-label">Gender</label><br>

            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" required>
                <label class="form-check-label">Male</label>
            </div>

            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender">
                <label class="form-check-label">Female</label>
            </div>

            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender">
                <label class="form-check-label">Other</label>
            </div>

            <div class="invalid-feedback d-block">
                Please select gender
            </div>
        </div>

        <!-- BUTTON -->
        <button class="btn btn-primary w-100">Register</button>

    </form>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- SIMPLE VALIDATION -->
<script>
(() => {
    const form = document.querySelector(".needs-validation");

    form.addEventListener("submit", function(e){
        if(!form.checkValidity()){
            e.preventDefault();
            e.stopPropagation();
        }
        form.classList.add("was-validated");
    });
})();

// TOOLTIP
var tooltipList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
tooltipList.map(el => new bootstrap.Tooltip(el));
</script>

</body>
</html>
