<!doctype html>
<html>
  <head>
    <title>Employee Directory</title>

    <style>
      body {
        font-family: Arial;
        background: #f4f6f9;
        margin: 0;
        text-align: center;
      }

      h2 {
        margin: 20px;
      }

      .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
      }

      .card {
        background: white;
        width: 220px;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      .card img {
        width: 100%;
        border-radius: 8px;
      }

      .name {
        font-weight: bold;
        margin-top: 10px;
      }

      .dept {
        color: #007bff;
      }

      .salary {
        color: green;
      }
    </style>
  </head>

  <body>
    <h2>👨‍💼 Employee Directory</h2>

    <div class="container" id="employees"></div>
    
    <script>
      fetch("/api/employees")
        .then((res) => res.json())
        .then((data) => {
          let container = document.getElementById("employees");

          data.forEach((emp) => {
            container.innerHTML += `
            <div class="card">
                <img src="${emp.image}">
                <div class="name">${emp.name}</div>
                <div>${emp.designation}</div>
                <div class="dept">${emp.department}</div>
                <div class="salary">${emp.salary}</div>
            </div>
        `;
          });
        });
    </script>
  </body>
</html>
